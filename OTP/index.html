<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP GENERATOR</title>
    <style>
        body {
            background-color: rgb(213, 235, 235);
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            min-height: 300px;
            width: min(100%, 340px);
            box-sizing: border-box;
            padding: 24px 16px;
            background-color: rgb(196, 190, 190);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        h1 {
            font-size: 25px;
            max-width: 100%;
        }

        button {
            cursor: pointer;
            border: none;
            padding: 9px;
            border-radius: 10px;

        }

        #showotp {
            background-color: #fff;
            padding: 19px;
            width: 140px;
            box-sizing: border-box;
            margin-bottom: 10px;
            border-radius: 10px;
            color: #ff7300;
            font-weight: bolder;
            font-size: 20px;
            text-align: center;
        }

        button {
            height: 20px;
            width: 100px;
            background-color: rgb(226, 238, 238);
            margin-bottom: 10px;
            border: none;
            text-align: center;
            border-radius: 10px;
            padding: 8px;
        }

        .glow-on-hover {
            width: min(220px, 100%);
            height: 50px;
            box-sizing: border-box;
            border: none;
            outline: none;
            color: #fff;
            background: #111;
            cursor: pointer;
            position: relative;
            z-index: 0;
            border-radius: 10px;
        }

        .glow-on-hover:before {
            content: '';
            background: linear-gradient(45deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000);
            position: absolute;
            top: -2px;
            left: -2px;
            background-size: 400%;
            z-index: -1;
            filter: blur(5px);
            width: calc(100% + 4px);
            height: calc(100% + 4px);
            animation: glowing 20s linear infinite;
            opacity: 0;
            transition: opacity .3s ease-in-out;
            border-radius: 10px;
        }

        .glow-on-hover:active {
            color: #000
        }

        .glow-on-hover:active:after {
            background: transparent;
        }

        .glow-on-hover:hover:before {
            opacity: 1;
        }

        .glow-on-hover:after {
            z-index: -1;
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: #111;
            left: 0;
            top: 0;
            border-radius: 10px;
        }

        @keyframes glowing {
            0% {
                background-position: 0 0;
            }

            50% {
                background-position: 400% 0;
            }

            100% {
                background-position: 0 0;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>OTP GENERATOR</h1>
        <div id="showotp"></div>
        <button class="glow-on-hover" type="button" onclick="Otp()">Generate OTP</button>

    </div>
    <script>
        function Otp() {
            // alert("hii")
            otp = Math.floor(100000 + Math.random() * 900000).toString()
            document.getElementById("showotp").innerHTML = otp
        }
    </script>
</body>

</html>
